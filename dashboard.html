<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autonomous Retail Monitoring Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #00E676; margin-bottom: 20px; }
        .grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .card { background-color: #1E1E1E; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; width: 45%; min-width: 320px; }
        .card img { width: 100%; height: auto; border-radius: 8px; border: 2px solid #333; }
        .card h2 { margin-top: 10px; font-size: 1.2rem; color: #BB86FC; }
    </style>
</head>
<body>
    <h1>Autonomous Retail AI Surveillance & Tracking</h1>
    <div class="grid">
        <div class="card">
            <h2>Camera 1: Entry / Exit (Customer ReID)</h2>
            <img src="/video_feed_entry" alt="Camera 1 Stream">
        </div>
        <div class="card">
            <h2>Camera 2: Shelf Area (Pose & Interaction)</h2>
            <img src="/video_feed_shelf" alt="Camera 2 Stream">
        </div>
    </div>
</body>
</html>
