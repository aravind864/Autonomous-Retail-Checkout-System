<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart Retail – View your live cart and pay via UPI QR code.">
    <title>Smart Store – Customer App</title>
    <!-- External Stylesheet (served from static/css/) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/customer_app.css') }}">
</head>
<body>
    <div class="mobile-card">

        <!-- Header -->
        <div class="header">
            <h2>Smart Retail Cart</h2>
            <p id="cust-id">Customer: CUST_1</p>
        </div>

        <!-- Cart Items List -->
        <ul class="cart-list" id="cart-items">
            <!-- Items injected dynamically by customer_app.js -->
        </ul>

        <!-- Bill Total -->
        <div class="total-section">
            <span>Total Bill:</span>
            <span id="cart-total">₹0</span>
        </div>

        <!-- QR Code Payment -->
        <div class="qr-container" id="qr-box">
            <p class="qr-hint">Scan QR code at exit gate to pay</p>
            <div id="qr-img-slot"></div>
        </div>

    </div>

    <!-- External JavaScript (served from static/js/) -->
    <script src="{{ url_for('static', filename='js/customer_app.js') }}"></script>
</body>
</html>
