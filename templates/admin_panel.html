<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Autonomous Retail Checkout – Admin Configuration Panel">
    <title>Admin Panel – Autonomous Retail</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-page">

    <!-- Animated Background Orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <!-- Top Navigation Bar -->
    <nav class="admin-nav">
        <div class="nav-brand">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="M9 12l2 2 4-4"/>
            </svg>
            <span>Autonomous Retail</span>
        </div>
        <div class="nav-right">
            <div class="nav-status" id="system-status">
                <span class="status-dot status-online"></span>
                System Online
            </div>
            <a href="/admin/logout" class="btn-logout" id="btn-logout">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Logout
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <h1>Camera Configuration</h1>
            <p>Set your IP Webcam camera URLs or USB webcam indices.</p>
        </header>

        <div class="admin-grid">
            <!-- ─── Camera Configuration Card ─── -->
            <section class="config-card card-cameras" id="camera-config-card">
                <div class="card-header">
                    <div class="card-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                    </div>
                    <div>
                        <h2>Camera Sources</h2>
                        <p class="card-desc">IP Webcam URLs or USB camera indices</p>
                    </div>
                </div>

                <form id="camera-form" class="config-form">
                    <div class="form-field">
                        <label for="entry-cam">
                            <span class="label-badge badge-entry">CAM 1</span>
                            Entry / Exit Camera
                        </label>
                        <div class="input-with-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                                <line x1="8" y1="21" x2="16" y2="21"/>
                                <line x1="12" y1="17" x2="12" y2="21"/>
                            </svg>
                            <input type="text" id="entry-cam" name="entry_cam"
                                   value="{{ entry_cam }}"
                                   placeholder="http://192.168.1.101:8080/video  or  0">
                        </div>
                        <span class="field-hint">Tip: Open IP Webcam app → Start Server → use IP shown</span>
                    </div>

                    <div class="form-field">
                        <label for="shelf-cam">
                            <span class="label-badge badge-shelf">CAM 2</span>
                            Shelf / Overhead Camera
                        </label>
                        <div class="input-with-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                                <line x1="8" y1="21" x2="16" y2="21"/>
                                <line x1="12" y1="17" x2="12" y2="21"/>
                            </svg>
                            <input type="text" id="shelf-cam" name="shelf_cam"
                                   value="{{ shelf_cam }}"
                                   placeholder="http://192.168.1.102:8080/video  or  1">
                        </div>
                        <span class="field-hint">Both phones & laptop must be on the same Wi-Fi network</span>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-test" id="btn-test-cameras" title="Test camera connections">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                            Test Connection
                        </button>
                        <button type="submit" class="btn-save" id="btn-save-cameras">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                                <polyline points="17 21 17 13 7 13 7 21"/>
                                <polyline points="7 3 7 8 15 8"/>
                            </svg>
                            Save & Apply
                        </button>
                    </div>
                </form>

                <!-- Toast Notification -->
                <div class="toast-container" id="camera-toast"></div>
            </section>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
